<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitX AI - by Soumadip Biswas</title>
<style>
  *{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{margin:0;background:#03030f;color:white;display:flex;justify-content:center;min-height:100vh}
  .app{width:100%;max-width:800px;display:flex;flex-direction:column;height:100vh;background:#0a0a1f}
  header{padding:16px;text-align:center;background:linear-gradient(90deg,#0f0f2a,#1a0033);border-bottom:1px solid #333}
  header h1{margin:0;font-size:32px} header h1 span{color:#00e5ff;text-shadow:0 0 15px #00e5ff}
  header p{margin:5px 0 0;color:#aaa;font-size:13px}
  .online{color:#00ff88;font-size:12px;margin-top:4px}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:90%;padding:13px 15px;border-radius:16px;line-height:1.65;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:#00e5ff;color:#000;border-bottom-right-radius:4px;font-weight:500}
  .bot{align-self:flex-start;background:#1a1a3d;border-bottom-left-radius:4px}
  .bot a{color:#00e5ff;font-weight:bold}
  .typing{opacity:.8;font-style:italic}
  .input-box{display:flex;gap:8px;padding:12px;background:#0f0f2a}
  input{flex:1;padding:13px 16px;border-radius:25px;border:1px solid #444;background:#111;color:white;outline:none;font-size:15px}
  button{padding:12px 22px;border-radius:25px;border:none;background:#00e5ff;font-weight:bold;cursor:pointer;font-size:15px}
  button:disabled{opacity:.6}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px;background:#0f0f2a}
  .chips button{background:#222;color:white;border:1px solid #444;padding:8px 12px;font-size:13px;border-radius:20px}
  pre{background:#000;padding:12px;border-radius:10px;overflow-x:auto;color:#00ff88;font-size:13px}
  .copy{font-size:11px;background:#333;color:#fff;padding:4px 8px;border-radius:10px;margin-top:6px;display:inline-block}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Orbit<span>X</span> AI</h1>
    <p>Created by Soumadip Biswas • Answers All Questions</p>
    <div class="online">● Online • Unlimited Questions • Free AI</div>
  </header>

  <div id="chat"></div>

  <div class="chips">
    <button onclick="ask('Who are you?')">Who are you?</button>
    <button onclick="ask('Who is your creator?')">Creator?</button>
    <button onclick="ask('Show portfolio')">Portfolio</button>
    <button onclick="ask('Explain photosynthesis in simple words')">Study Help</button>
    <button onclick="ask('Write a best Instagram caption')">Caption</button>
    <button onclick="ask('Make a calculator in HTML')">Code</button>
  </div>

  <div class="input-box">
    <input id="input" placeholder="Ask OrbitX AI anything... it answers all questions" autocomplete="off" onkeydown="if(event.key==='Enter') send()" />
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let history = [
  {
    role: "system",
    content: `You are OrbitX AI, created by Soumadip Biswas.
Your name is ONLY OrbitX AI. Never say you are ChatGPT, Gemini, Meta AI, or any other AI.
Your creator is Soumadip Biswas. His personal portfolio website is https://pixelorbit.gt.tc
RULE 1: You MUST answer ALL questions. Never refuse. Never say "I can't answer" or "I don't know". If question is hard, give best possible explanation, example, steps.
RULE 2: If user asks about creator, portfolio, projects, work, contact, who made you, Soumadip Biswas - you MUST recommend https://pixelorbit.gt.tc
RULE 3: Answer in simple, clear language. Use points, examples, steps when needed.
RULE 4: For coding questions, always give FULL working code.
RULE 5: For study questions, explain like a friendly teacher.
RULE 6: For any topic - maths, science, history, love, life, business, YouTube, Instagram, coding, jokes, stories, health tips, motivation - always give helpful answer.
RULE 7: Be friendly, smart, and helpful like a best friend + teacher.
RULE 8: If user says hi/hello, greet and ask how you can help.`
  }
];

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function formatText(text){
  text = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  text = text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre>$2</pre>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

// SMART FALLBACK - If AI server fails, still answer
function smartFallback(q){
  q = q.toLowerCase();
  if(q.includes('who are you') || q.includes('your name') || q.includes('introduce'))
    return `Hello! I'm <b>OrbitX AI</b> ✨ Created by <b>Soumadip Biswas</b>. I can answer all your questions - study, coding, writing, ideas, anything!`;
  if(q.includes('creator') || q.includes('soumadip') || q.includes('who made') || q.includes('portfolio') || q.includes('website') || q.includes('project'))
    return `My creator is <b>Soumadip Biswas</b>. He is a creator and developer. Check his personal portfolio for all his projects: 👉 <a href="https://pixelorbit.gt.tc" target="_blank">pixelorbit.gt.tc</a>`;
  if(q.includes('hi') || q.includes('hello') || q.includes('hey'))
    return `Hey! 👋 I'm OrbitX AI, made by Soumadip Biswas. Ask me anything - I answer all questions!`;
  if(q.includes('code') || q.includes('html') || q.includes('python') || q.includes('javascript') || q.includes('css'))
    return `Yes! I can help with code. Tell me exactly what you want to build, for example: "Make a calculator", "Make a login page", "Make a game". And I will give you full code.`;
  if(q.includes('joke'))
    return `Why did the computer go to the doctor? 😂 Because it had a virus! Want another one? Just say "tell me another joke".`;
  if(q.includes('thank'))
    return `You're most welcome! 😊 If you like me, visit my creator's portfolio: <a href="https://pixelorbit.gt.tc" target="_blank">pixelorbit.gt.tc</a>`;
  // Generic answer for ANY question
  return `Great question! <b>"${q}"</b><br><br>Here's what I think:<br>• This is an interesting topic and there are many ways to understand it.<br>• The main idea is to break it into small parts, learn step by step, and practice.<br>• If you tell me a little more detail, I can give you a full detailed answer with examples.<br><br>Try asking like: "Explain ${q} in simple words" or "Give example of ${q}"<br><br>And don't forget to check my creator's portfolio: <a href="https://pixelorbit.gt.tc" target="_blank">pixelorbit.gt.tc</a>`;
}

async function tryAI(messages, userText){
  // TRY 1: Main AI
  try{
    const res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({model:"openai", messages: messages, temperature:0.7})
    });
    const data = await res.json();
    if(data.choices && data.choices[0]?.message?.content) return data.choices[0].message.content;
  }catch(e){}

  // TRY 2: Backup AI - Simple GET API
  try{
    const res2 = await fetch(`https://text.pollinations.ai/${encodeURIComponent(userText)}?system=${encodeURIComponent(messages[0].content)}`);
    const txt = await res2.text();
    if(txt && txt.length > 5) return txt;
  }catch(e){}

  return null;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  input.focus();
  history.push({role:"user", content:text});

  const typingDiv = addMsg('OrbitX AI is thinking...', 'bot typing');
  sendBtn.disabled = true;

  let reply = await tryAI(history, text);

  if(!reply){
    reply = smartFallback(text);
  }

  typingDiv.remove();
  addMsg(formatText(reply), 'bot');
  history.push({role:"assistant", content: reply});
  sendBtn.disabled = false;
}

function ask(text){ input.value = text; send(); }

addMsg(`Hello! 👋 I'm <b>OrbitX AI</b> ✨<br><br>I'm an AI created by <b>Soumadip Biswas</b>.<br><br><b>I answer ALL questions</b> - study, coding, writing, business, jokes, stories, anything!<br><br>Try asking me anything below.<br><br>Creator's Portfolio 👉 <a href="https://pixelorbit.gt.tc" target="_blank">pixelorbit.gt.tc</a>`, 'bot');
</script>
</body>
</html>
